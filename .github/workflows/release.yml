name: Release

# Every push to main that passes the tests becomes a release: the next version
# number is picked automatically (the newest v* tag with its last number plus
# one, starting at 0.14.0), mcs-tray.exe is built with that version baked in,
# and the _windows_setup.exe installer is published. Installed copies pick it up
# through their own update check, which reads this repository's latest release.
#
# Pushes that only touch documentation do not release. Run the workflow by hand
# (Actions tab, "Run workflow") to release without a code change.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

# One release at a time. Two pushes in quick succession would otherwise both
# read the same newest tag and both claim the next version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The suite gates the release: a push cannot publish a build whose tests fail.
  #
  # An identical copy of this job runs on every push and pull request, in
  # .github/workflows/ci.yml. Change both, or they drift: a Go bump or a new
  # step added only here means the continuous run stops
  # matching the gate.
  #
  # go-version is 1.24, not the 1.22 in go.mod, and the same in every job here
  # on purpose: go.mod's version is a minimum, not a toolchain pin, and testing
  # on one toolchain while shipping another means the gate is not checking the
  # artifact.
  test:
    # Windows is the only platform this project ships for. CGO stays off, the
    # way the tray is built: systray and WebView2 are pure Go on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: '0'
        # -count=1 so a cached result from an earlier run cannot stand in for
        # this one. There is no gofmt check here on purpose: the repository
        # checks out with CRLF on Windows, which makes gofmt -l flag every file.
        run: go test ./... -count=1

  # One job creates the release; the build job only uploads into it.
  #
  # When there were two build jobs (macOS and Windows), each published with an
  # action that creates the release when it is missing, and on v0.13.3 both did:
  # one release won and the other's asset was stranded in a draft. Creating it
  # here, once, before any build starts, keeps that from coming back if a second
  # build job is ever added. internal/releaseflow's test fails if a second
  # release-creating step appears.
  #
  # The release starts as a draft and is published only once the installer is
  # attached: a published release with no installer would make every installed
  # copy's update check report "no download for this computer".
  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, to find the newest version.
          fetch-depth: 0

      - name: Pick the version
        id: next
        run: |
          set -euo pipefail
          # A re-run of a commit that was already released keeps its version.
          tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            floor=0.14.0
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
            next=$floor
            if [ -n "$latest" ]; then
              IFS=. read -r major minor patch <<<"${latest#v}"
              bumped="$major.$minor.$((patch + 1))"
              # Never below the floor: the first release has to be newer than
              # the upstream 0.13.x the code started from.
              next=$(printf '%s\n%s\n' "$bumped" "$floor" | sort -V | tail -1)
            fi
            tag="v$next"
          fi
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Idempotent on purpose: a re-run must not fail because the draft it made
      # the first time still exists. A draft left by a failed run is pointed at
      # this commit, since publishing it creates the tag where it points.
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; pointing it at $GITHUB_SHA."
            gh release edit "$TAG" --target "$GITHUB_SHA" || true
            exit 0
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Windows tray binary
        shell: pwsh
        # systray is pure-Go on Windows, so no C toolchain / CGO is needed.
        # -H=windowsgui makes it a GUI-subsystem exe, so it runs from the tray
        # with no console window. The exe's file icon comes from a committed
        # Windows resource (cmd/mcs-tray/rsrc_windows_amd64.syso), linked
        # automatically. Only the tray app ships; the CLI is built from source.
        env:
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-H=windowsgui -X github.com/miou1107/multi-claude-switcher/core.Version=$($env:VERSION)" -o dist/mcs-tray.exe ./cmd/mcs-tray

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        # A proper Setup.exe is the sole Windows download: per-user install, Start
        # Menu shortcut, uninstaller. Upgrades run the newer installer, which
        # replaces the running exe in place, so there is no separate update zip.
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=$($env:VERSION)" packaging\windows-setup.iss
          Get-ChildItem dist

      # bash, not pwsh: the glob is expanded by the shell, and PowerShell does
      # not. Git Bash ships on windows-latest.
      - name: Upload the Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Multi-Claude-Switcher_*_windows_setup.exe --clobber

      # Last, so the release only becomes visible to update checks once the
      # installer they look for is on it.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
