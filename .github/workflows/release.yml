name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.6.1 && git push origin v0.6.1
# Builds mcs-tray.exe (pure Go, no CGO) with the version baked in and attaches a
# single _windows_setup.exe installer. Upgrades run the newer installer, which replaces
# the running exe in place, so there is no separate self-update zip.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The suite gates the release: a tag cannot publish a build whose tests fail.
  #
  # An identical copy of this job runs on every push and pull request, in
  # .github/workflows/ci.yml. Change both, or they drift: a Go bump or a new
  # step added only here means the continuous run stops
  # matching the gate, and the gate is the one nobody exercises until a tag.
  #
  # go-version is 1.24, not the 1.22 in go.mod, and the same in every job here
  # on purpose: go.mod's version is a minimum, not a toolchain pin, and testing
  # on one toolchain while shipping another means the gate is not checking the
  # artifact.
  test:
    # Windows is the only platform this project ships for. CGO stays off, the
    # way the tray is built: systray and WebView2 are pure Go on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: '0'
        # -count=1 so a cached result from an earlier run cannot stand in for
        # this one. There is no gofmt check here on purpose: the repository
        # checks out with CRLF on Windows, which makes gofmt -l flag every file.
        run: go test ./... -count=1

  # One job creates the release; the build job only uploads into it.
  #
  # When there were two build jobs (macOS and Windows), each published with an
  # action that creates the release when it is missing, and on v0.13.3 both did:
  # one release won and the other's asset was stranded in a draft. Creating it
  # here, once, before any build starts, keeps that from coming back if a second
  # build job is ever added. internal/releaseflow's test fails if a second
  # release-creating step appears.
  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Idempotent on purpose: re-running a failed workflow must not fail here
      # because the release it made the first time still exists.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows tray binary
        shell: pwsh
        # systray is pure-Go on Windows, so no C toolchain / CGO is needed.
        # -H=windowsgui makes it a GUI-subsystem exe, so it runs from the tray
        # with no console window. The exe's file icon comes from a committed
        # Windows resource (cmd/mcs-tray/rsrc_windows_amd64.syso), linked
        # automatically. Only the tray app ships (CLI omitted, matching macOS).
        env:
          CGO_ENABLED: '0'
          LDFLAGS: '-H=windowsgui -X github.com/miou1107/multi-claude-switcher/core.Version=${{ steps.ver.outputs.version }}'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "$env:LDFLAGS" -o dist/mcs-tray.exe ./cmd/mcs-tray

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        # A proper Setup.exe is the sole Windows download: per-user install, Start
        # Menu shortcut, uninstaller. Upgrades run the newer installer, which
        # replaces the running exe in place — so no separate self-update zip.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=$($env:VERSION)" packaging\windows-setup.iss
          Get-ChildItem dist

      # bash, not pwsh: the glob and $GITHUB_REF_NAME are expanded by the shell,
      # and PowerShell does neither. Git Bash ships on windows-latest.
      - name: Upload the Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Multi-Claude-Switcher_*_windows_setup.exe --clobber
